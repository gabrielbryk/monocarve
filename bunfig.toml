[test]
# Only `test/` is a test root. `fixtures/` deliberately contains a file named
# `*.test.ts` — it is input data for the engine, not a suite to execute.
root = "./test"
# The per-test timeout (Bun 1.4.2 does not read a `timeout` key here) is set
# via `--timeout` on the `test` script in package.json, not this file.
