name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag, package.json, and TOOL_VERSION must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          tool="$(sed -n 's/^export const TOOL_VERSION = "\(.*\)" as const;$/\1/p' src/branding.ts)"
          echo "tag=$tag package.json=$pkg TOOL_VERSION=$tool"
          test "$tag" = "$pkg" && test "$pkg" = "$tool"

  # Reuse the same static/test/package/validate gates CI runs on every push
  # and PR, instead of re-implementing them here.
  gates:
    needs: verify-version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:bundle
      - run: bun run verify-package
      - run: npm publish --provenance --access public
